name: GitHub Pages - Safe Static Status

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # The data workflows push their commits with GITHUB_TOKEN, and GitHub does not start
  # another workflow from such a push: without this, every automated commit left the
  # published site a version behind until the next human push.
  workflow_run:
    # These are the `name:` fields, not the file names; GitHub matches on the display name.
    workflows:
      - Zero-Baht Research and Drafts
      - AF Verified Facts (durable, no secrets)
      - AF Public Watch (free, no secrets)
      - AF Revenue Verify (free, no secrets)
    types: [completed]
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # delete previous deploy artifacts, which otherwise exhaust the quota

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A `workflow_run` fires for every completion of an allowlisted workflow, including a
    # failed or cancelled one and including runs on other branches. Only a green run on
    # main may publish; the other triggers are explicit and always allowed.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.retry2.outputs.page_url || steps.retry1.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the trigger
        # The job-level `if` above is the real gate. This step re-checks the same rule in
        # code, so a drift between the YAML and the allowlist fails the job loudly instead
        # of deploying.
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
        run: python tools/af_deploy_gate.py
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
            # A visible warning beats a silently dead site: the deploy still runs, and the step
      # shows up as failed-but-ignored instead of taking the whole job down.
      - name: Delete older deploy artifacts
        continue-on-error: true
        # Each artifact is ~64 MB and the account's storage is 500 MB, so a handful of
        # deploys would stop the next one from being kept. Only this workflow's own
        # artifacts are removed, and only before the new one is uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in ${ids}; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
          echo "artifact cleanup: ${ids:-none}"

      - name: Upload safe static status page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site
          # The site carries 62 MB of media, so a deploy artifact is ~64 MB. At the
          # default 90-day retention eight deploys fill the account's 500 MB artifact
          # quota; past that the upload "succeeds" and deploy-pages then finds no
          # artifact at all.
          retention-days: 1
      # deploy-pages looks the artifact up through the API and sometimes cannot see one
      # the upload step has just finalised. The first two attempts are allowed to fail so
      # that a later success leaves the job green; the last attempt decides the job.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wait for the artifact to become visible
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry 1)
        id: retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wait longer
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry 2)
        id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
