name: AF Verified Facts (durable, no secrets)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: af-facts
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reader dependency
        run: pip install --quiet eth-utils "eth-hash[pycryptodome]"
      - name: Build the verified facts
        run: python -m tools.af_facts --out site/facts --write || true
      - name: Refresh the service queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.af_service --write || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/facts
          if ! git diff --cached --quiet; then
            git commit -m "chore: verified facts + service queue refresh"
            git pull --rebase
            git push
          fi
