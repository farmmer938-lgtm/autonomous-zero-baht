name: AF Verified Facts (durable, no secrets)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: af-facts
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install reader dependency
        run: pip install --quiet eth-utils "eth-hash[pycryptodome]"

      # Each tool is allowed to fail (a dead third-party API must not wake K), but a failure
      # is recorded and published instead of being swallowed. A green run with a silent
      # failure is what let a missed payment scan go unnoticed.
      - name: Refresh public artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          : > /tmp/af_failed.txt
          run() {
            name="$1"; shift
            if "$@" > /tmp/af_step.log 2>&1; then
              echo "ok   $name"
            else
              echo "FAIL $name"
              tail -5 /tmp/af_step.log
              echo "$name" >> /tmp/af_failed.txt
            fi
          }
          run af_facts      python -m tools.af_facts --out site/facts --write
          run af_tokens     python -m tools.af_tokens --write
          run af_outbound   python -m tools.af_outbound --scan --hours 24 --min-liq 10000 --write
          run af_launch     python -m tools.af_launch_watch --once --blocks 200 --write
          run af_farcaster  python -m tools.af_farcaster channels --write
          run af_agent_api  python -m tools.af_agent_api --build
          run af_invoices   python -m tools.af_selfserve --invoices --write
          run af_scan       python -m tools.af_selfserve --scan --write
          run af_service    python -m tools.af_service --write
          echo "--- failed steps: $(wc -l < /tmp/af_failed.txt) ---"
          cat /tmp/af_failed.txt

      - name: Record run health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          from datetime import datetime, timezone

          failed = [l.strip() for l in pathlib.Path("/tmp/af_failed.txt").read_text().splitlines() if l.strip()]
          now = datetime.now(timezone.utc).isoformat()
          path = pathlib.Path("data/workflow_health.json")
          try:
              health = json.loads(path.read_text())
          except Exception:
              health = {"schema": "af.workflow_health.v1", "runs": []}
          health["runs"] = (health["runs"] + [{"at": now, "workflow": "facts", "failed": failed}])[-20:]
          path.write_text(json.dumps(health, indent=1) + "\n")
          if not failed:
              print("all steps ok")
              raise SystemExit(0)

          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True).stdout.strip()

          body = ("AF facts run %s: these steps failed and published nothing fresh:\n\n%s\n\n"
                  "_Automated by AF; K is not in the loop._") % (
                      now, "\n".join("- `%s`" % f for f in failed))
          open_no = gh("issue", "list", "--label", "af-alert", "--state", "open",
                       "--json", "number", "--jq", ".[0].number")
          if open_no:
              gh("issue", "comment", open_no, "--body", body)
          else:
              gh("issue", "create", "--title", "AF facts: %d step(s) failing" % len(failed),
                 "--label", "af-alert", "--body", body)
          print("reported:", failed)
          PY

      - name: Commit
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/facts site/pay-tokens.json site/outbound site/reviews site/api site/paid \
                  data/workflow_health.json data/paid_ledger.json
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: verified facts + service queue refresh"
          # These files are regenerated artifacts, so the copy this run just produced wins:
          # `-X ours` keeps the local output. `-X theirs` would silently keep origin/main and
          # discard the fresh run, which is the opposite of what the old comment claimed.
          git pull --no-rebase -X ours --no-edit origin main || true
          git push origin main || (git pull --no-rebase -X ours --no-edit origin main && git push origin main)
