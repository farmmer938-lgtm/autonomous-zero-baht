name: AF Verified Facts (durable, no secrets)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: af-facts
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reader dependency
        run: pip install --quiet eth-utils "eth-hash[pycryptodome]"
      - name: Build the verified facts
        run: python -m tools.af_facts --out site/facts --write || true
      - name: Refresh the verified token list
        run: python -m tools.af_tokens --write || true
      - name: Hunt new Base tokens and write transparency reports
        run: python -m tools.af_outbound --scan --hours 24 --min-liq 10000 --write || true
      - name: Watch new Base blocks for fresh tokens
        run: python -m tools.af_launch_watch --once --blocks 200 --write || true
      - name: Refresh Farcaster channel list
        run: python -m tools.af_farcaster channels --write || true
      - name: Build the agent API + free quick-check
        run: python -m tools.af_agent_api --build || true
      - name: Write the per-target invoices
        run: python -m tools.af_selfserve --invoices --write || true
      - name: Scan for inbound payments and auto-unlock
        run: python -m tools.af_selfserve --scan --write || true
      - name: Refresh the service queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.af_service --write || true
      - name: Commit
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/facts site/pay-tokens.json site/outbound site/reviews site/api site/paid
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: verified facts + service queue refresh"
          # These files are regenerated artifacts, so on any collision the freshest copy wins.
          # Gemini advice 2026-11-18: never let an overlapping run fail the job. AF does not use
          # git pull --rebase on this fast-moving branch (AGENTS.md); a merge with -X theirs
          # resolves an add/add conflict deterministically instead of stopping for a human.
          git pull --no-rebase -X theirs --no-edit origin main || true
          git push origin main || (git pull --no-rebase -X theirs --no-edit origin main && git push origin main)
