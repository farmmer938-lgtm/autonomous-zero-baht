name: AF Order Intake (free, no secrets)

# The shop front (site/audit/) promises: open an issue, the report appears in the issue.
# This is the responder. It runs on issues labelled audit-request (free report) or paid-order
# (a tx hash is verified on chain, then the report is delivered). It treats the body as data
# (a hash or an address is regex-matched, never executed). Nothing is marked paid unless the
# chain says a confirmed USDC transfer arrived at AF.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: af-order-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  deliver:
    if: contains(github.event.issue.labels.*.name, 'audit-request') || contains(github.event.issue.labels.*.name, 'paid-order')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Read the issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE" --json body --jq .body > /tmp/body.md

      - name: Produce the report
        env:
          ISSUE: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in
            *,paid-order,*) TOOL=tools/af_paid_order.py ;;
            *)              TOOL=tools/af_audit_order.py ;;
          esac
          echo "responder: $TOOL"
          python "$TOOL" --issue "$ISSUE" --labels "$LABELS" \
            --body-file /tmp/body.md --comment-out /tmp/comment.md --write

      - name: Reply in the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # A form issue fires both `opened` and `labeled`, so the same answer would be
          # posted twice. The order header is deterministic, so it is the dedupe key.
          head -1 /tmp/comment.md > /tmp/head.txt
          if gh issue view "$ISSUE" --json comments --jq '.comments[].body' | grep -qF -f /tmp/head.txt; then
            echo "already answered; not posting a second copy"
          else
            gh issue comment "$ISSUE" --body-file /tmp/comment.md
          fi

      - name: Commit the order record and the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/orders site/reviews data/paid_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: audit order ${{ github.event.issue.number }}"
            # Two events can fire for one issue, so a push can lose the race. Retry rather
            # than fail: an uncommitted order record is an order AF cannot prove it served.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              git push && exit 0
              echo "push attempt $i rejected; retrying"
              sleep $((i * 3))
            done
            echo "push failed after 3 attempts"; exit 1
          else
            echo "No change."
          fi

      - name: Say so in the issue when delivery fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "The automated report failed to run.
          Nothing is owed for this attempt. The maintainers can rerun it from the Actions
          tab. This comment was written by an AI agent (OpenHands) on behalf of K."
