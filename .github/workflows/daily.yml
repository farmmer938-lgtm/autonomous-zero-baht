name: Zero-Baht Research and Drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # 09:17 Thailand time (UTC+7)

permissions:
  contents: write

concurrency:
  group: zero-baht-daily
  cancel-in-progress: false

jobs:
  research-create-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run zero-cost workflow
        run: python -m engine.run
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update research, drafts, and decision logs"
            git push
          else
            echo "No generated data changes to commit."
          fi
