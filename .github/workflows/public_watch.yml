name: AF Public Watch (free, no secrets)

# Runs on GitHub's infrastructure, which has no OpenHands sandbox quota, so AF can check
# its public revenue surfaces every 10 minutes at zero cost and zero token use.
#
# K is OUT of the loop: this job NEVER fails on purpose, so GitHub never emails K.
# Instead it opens/updates a GitHub Issue labelled "af-alert"; AF reads that issue itself
# over the API. When everything is clear the issue is closed automatically.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: af-public-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run public watch
        id: watch
        continue-on-error: true
        run: python -m engine.public_watch
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_watch.json site/status.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: public surface watch + status page"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          else
            echo "No change."
          fi
      - name: Report to AF via issue (never email K)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess, pathlib

          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True).stdout.strip()

          d = json.loads(pathlib.Path("data/public_watch.json").read_text())
          fail = d.get("fail") or []
          warn = d.get("warn") or []
          # Only listings the rail says it holds money for may be called paid work.
          new = d.get("new_paid_items", [])
          problem = bool(fail or new)

          open_no = gh("issue", "list", "--label", "af-alert", "--state", "open",
                       "--json", "number", "--jq", ".[0].number")

          if not problem:
              if open_no:
                  gh("issue", "close", open_no, "--comment",
                     "Back to normal: no FAIL surfaces and no new funded work "
                     "(checked_at %s). WARN: %s. Auto-closed by AF."
                     % (d.get("checked_at"), ", ".join(warn) or "none"))
              print("clear")
              raise SystemExit(0)

          lines = []
          if fail:
              lines.append("**FAIL (act now):** " + ", ".join(fail))
          if warn:
              lines.append("**WARN (look later, not blocking):** " + ", ".join(warn))
          for name in fail + [w for w in warn if w not in fail]:
              e = (d.get("surfaces") or {}).get(name) or {}
              if e.get("note"):
                  lines.append("- %s: %s (%s)" % (name, e.get("note"), e.get("url")))
          if new:
              lines.append("**New listings with money held by the rail:**")
              for i in new:
                  lines.append("- $%s on %s: %s -> %s"
                               % (i.get("reward_usd"), i.get("rail"), i.get("title"), i.get("url")))
          body = ("AF self-check found FAIL items (checked_at %s):\n\n%s\n\n"
                  "_Automated by AF; K is not in the loop._") % (d.get("checked_at"), "\n".join(lines))
          title = "AF alert: " + (", ".join(fail) if fail else "%d new funded listing(s)" % len(new))
          if open_no:
              # Same issue for a repeat FAIL, so the thread keeps the history.
              gh("issue", "comment", open_no, "--body", body)
          else:
              gh("issue", "create", "--title", title, "--label", "af-alert", "--body", body)
          print("alerted:", title)
          PY
