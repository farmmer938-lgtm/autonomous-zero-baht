name: AF Public Watch (free, no secrets)

# Runs on GitHub's infrastructure, which has no OpenHands sandbox quota, so AF can check
# its public revenue surfaces every 10 minutes at zero cost and zero token use.
#
# K is OUT of the loop: this job NEVER fails on purpose, so GitHub never emails K.
# Instead it opens/updates a GitHub Issue labelled "af-alert"; AF reads that issue itself
# over the API. When everything is clear the issue is closed automatically.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: af-public-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run public watch
        id: watch
        continue-on-error: true
        run: python -m engine.public_watch
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_watch.json site/status.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: public surface watch + status page"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          else
            echo "No change."
          fi
      - name: Report to AF via issue (never email K)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess, pathlib

          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True).stdout.strip()

          d = json.loads(pathlib.Path("data/public_watch.json").read_text())
          down = d.get("down", [])
          new = d.get("new_items", [])
          problem = bool(down or new)

          open_no = gh("issue", "list", "--label", "af-alert", "--state", "open",
                       "--json", "number", "--jq", ".[0].number")

          if not problem:
              if open_no:
                  gh("issue", "close", open_no, "--comment",
                     "All surfaces healthy and no new paid work (checked_at %s). Auto-closed by AF." % d.get("checked_at"))
              print("clear")
              raise SystemExit(0)

          lines = []
          if down:
              lines.append("**Surfaces down:** " + ", ".join(down))
          if new:
              lines.append("**New paid opportunities:**")
              for i in new:
                  lines.append("- $%s on %s: %s -> %s" % (i.get("reward_usd"), i.get("rail"), i.get("title"), i.get("url")))
          body = ("AF self-check found work/attention needed (checked_at %s):\n\n%s\n\n"
                  "_Automated by AF; K is not in the loop._") % (d.get("checked_at"), "\n".join(lines))
          title = "AF alert: " + (", ".join(down) if down else "%d new paid opportunity(ies)" % len(new))
          if open_no:
              gh("issue", "comment", open_no, "--body", body)
          else:
              gh("issue", "create", "--title", title, "--label", "af-alert", "--body", body)
          print("alerted:", title)
          PY
