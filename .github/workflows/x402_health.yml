name: AF x402 endpoint health

# K rule (2026-11-26): nothing gets listed anywhere until the endpoint has answered for 14
# straight days. This job is the measurement: one probe every 30 minutes, appended to
# site/data/x402_health.json (672 samples = 14 days), never invented, never auto-listed.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: af-x402-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe the endpoint
        run: |
          set -u
          python3 tools/af_x402_watch.py || echo "probe recorded a failure (that is data)"
      - name: Commit the health record
        run: |
          set -u
          git config user.name "af-health-bot"
          git config user.email "af-health-bot@users.noreply.github.com"
          git add site/data/x402_health.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "health: x402 probe $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
