<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lazada authorization</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;margin:0;padding:40px;background:#0f172a;color:#e2e8f0}
  .card{max-width:560px;margin:0 auto;background:#1e293b;border-radius:14px;padding:28px}
  h1{font-size:20px;margin:0 0 12px}
  code{background:#0f172a;padding:2px 6px;border-radius:6px;word-break:break-all}
  .ok{color:#4ade80}.warn{color:#fbbf24}
</style>
</head>
<body>
<div class="card">
  <h1 id="h">Lazada authorization</h1>
  <p id="msg">Reading the authorization code…</p>
  <p><small>Code: <code id="code">—</code></small></p>
  <p><small class="warn">AF Studio automation. You can close this tab; the agent picks up the code automatically.</small></p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code') || q.get('auth_code') || '';
  var err = q.get('error') || q.get('error_description') || '';
  var h = document.getElementById('h'), msg = document.getElementById('msg'), el = document.getElementById('code');
  if (code) {
    el.textContent = code;
    h.textContent = 'Authorization received';
    h.className = 'ok';
    msg.textContent = 'Lazada approved the app. The agent is exchanging this code for an access token now.';
    try { localStorage.setItem('lazada_auth_code', code); localStorage.setItem('lazada_auth_code_ts', String(Date.now())); } catch (e) {}
    document.title = 'LAZADA_CODE:' + code;
  } else if (err) {
    h.textContent = 'Authorization failed';
    msg.textContent = err;
    document.title = 'LAZADA_ERR:' + err;
  } else {
    h.textContent = 'Waiting for the authorization code';
    msg.textContent = 'No code in the URL. Open this page through the Lazada authorize flow.';
  }
})();
</script>
</body>
</html>
